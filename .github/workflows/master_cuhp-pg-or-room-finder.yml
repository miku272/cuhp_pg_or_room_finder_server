# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - cuhp-pg-or-room-finder

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x' # Ensure this matches the package.json engine

      - name: npm install and build
        run: |
          npm install
          npm run build --if-present
          # Optionally prune dev dependencies if needed, Azure usually handles this
          # npm prune --production

      # Create a deployment package directory
      - name: Create deployment package
        run: |
          mkdir deployment_package
          cp -r dist deployment_package/dist
          cp package.json deployment_package/package.json
          cp package-lock.json deployment_package/package-lock.json
          # Add any other necessary files like .env.example or static assets here
          # cp .env.example deployment_package/.env.example

      - name: Zip artifact for deployment
        # Zip the contents of the deployment_package directory
        run: |
          cd deployment_package
          zip ../release.zip ./* -r
          cd ..

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip # Upload the zip file

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          # No path needed, downloads to the root

      - name: Unzip artifact for deployment
        run: unzip release.zip -d deployment_package # Unzip into a specific directory

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DFE731744360467C837635F6BFFA28EA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A1212B066CF14C878475812663D72693 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4D4EDB999BC44742A3C1F23D560E1662 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cuhp-pg-or-room-finder'
          slot-name: 'Production'
          package: ./deployment_package # Deploy the directory containing dist, package.json etc.
          # Azure will detect package.json and run npm install
          # It will use the start script from package.json: "node dist/src/index.js"
